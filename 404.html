<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>이동 중…</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#f4f6fb;color:#1c2333;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.spin{width:34px;height:34px;border:3.5px solid #dcdfff;border-top-color:#4a5cf0;border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
h1{font-size:1.15rem;font-weight:700}
p{color:#6b7385;font-size:.9rem;margin-top:8px;word-break:break-all}
a{color:#4a5cf0;font-weight:700;text-decoration:none}
#nf{display:none}
.big{font-size:2.6rem;margin-bottom:10px}
</style>
</head>
<body>
<div id="go"><div class="spin"></div><h1>이동하고 있어요…</h1><p id="slugShow"></p></div>
<div id="nf"><div class="big">🤔</div><h1>존재하지 않는 단축주소예요</h1><p id="nfSlug"></p><p style="margin-top:14px"><a href="javascript:history.back()">← 뒤로 가기</a></p></div>
<script>
const DB = "https://dobble-game-by-sujin-default-rtdb.asia-southeast1.firebasedatabase.app/konfesta31/shulinks";
(async function(){
  let path = location.pathname.replace(/^\//,"").replace(/\/+$/,"");
  // github.io 프로젝트 페이지에서는 첫 세그먼트가 저장소 이름
  if(location.hostname.endsWith("github.io")){
    const seg = path.split("/");
    seg.shift();
    path = seg.join("/");
  }
  let slug;
  try{ slug = decodeURIComponent(path); }catch{ slug = path; }
  if(!slug){ location.replace(location.hostname.endsWith("github.io") ? "/shu/" : "/"); return; }
  document.getElementById("slugShow").textContent = slug;
  try{
    const r = await fetch(`${DB}/${encodeURIComponent(slug)}.json`);
    const data = await r.json();
    if(data && data.url){
      fetch(`${DB}/${encodeURIComponent(slug)}/clicks.json`,{method:"PUT",body:JSON.stringify({".sv":{"increment":1}}),keepalive:true}).catch(()=>{});
      location.replace(data.url);
      return;
    }
  }catch(e){}
  document.getElementById("go").style.display="none";
  document.getElementById("nfSlug").textContent = '"'+slug+'"';
  document.getElementById("nf").style.display="block";
})();
</script>
</body>
</html>
