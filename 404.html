<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>이동 중…</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#f5f6fc;color:#191e2e;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:hidden}
body::before{content:"";position:fixed;top:-200px;left:50%;transform:translateX(-70%);width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(74,92,240,.16),transparent 65%)}
body::after{content:"";position:fixed;bottom:-220px;left:50%;transform:translateX(4%);width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(232,90,173,.13),transparent 65%)}
.box{position:relative;z-index:1;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);border-radius:24px;padding:40px 36px;box-shadow:0 10px 34px rgba(25,30,46,.08);max-width:400px}
.spin{width:38px;height:38px;border:3.5px solid #ded9ff;border-top-color:#4a5cf0;border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}
h1{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
p{color:#69718a;font-size:.9rem;margin-top:8px;word-break:break-all}
a{color:#4a5cf0;font-weight:800;text-decoration:none}
#nf{display:none}
.big{font-size:2.8rem;margin-bottom:12px}
.brand{margin-top:22px;font-size:.72rem;color:#9aa1b8;font-weight:700}
.brand b{background:linear-gradient(94deg,#4a5cf0,#8b3df2);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body>
<div class="box">
  <svg class="shushu" viewBox="0 0 200 190" xmlns="http://www.w3.org/2000/svg" aria-label="마스코트 슈슈" style="width:110px;display:block;margin:0 auto 6px">
    <ellipse cx="100" cy="180" rx="54" ry="7" fill="rgba(20,20,20,.12)"/>
    <g class="tail"><circle cx="147" cy="140" r="13" fill="#edd3ae" stroke="#141414" stroke-width="3.5"/></g>
    <ellipse cx="100" cy="147" rx="38" ry="33" fill="#edd3ae" stroke="#141414" stroke-width="3.5"/>
    <path d="M85 150 v20 a6.5 6.5 0 0 0 13 0 v-20" fill="#f2debd" stroke="#141414" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M102 150 v20 a6.5 6.5 0 0 0 13 0 v-20" fill="#f2debd" stroke="#141414" stroke-width="3.5" stroke-linejoin="round"/>
    <ellipse cx="53" cy="90" rx="18" ry="29" fill="#e3c493" stroke="#141414" stroke-width="3.5" transform="rotate(16 53 90)"/>
    <ellipse cx="147" cy="90" rx="18" ry="29" fill="#e3c493" stroke="#141414" stroke-width="3.5" transform="rotate(-16 147 90)"/>
    <ellipse cx="100" cy="50" rx="46" ry="35" fill="#edd3ae" stroke="#141414" stroke-width="3.5"/>
    <ellipse cx="100" cy="88" rx="35" ry="29" fill="#f2debd" stroke="#141414" stroke-width="3.5"/>
    <circle cx="87" cy="84" r="4.6" fill="#141414"/><circle cx="88.6" cy="82.4" r="1.5" fill="#fff"/>
    <circle cx="113" cy="84" r="4.6" fill="#141414"/><circle cx="114.6" cy="82.4" r="1.5" fill="#fff"/>
    <ellipse cx="100" cy="97" rx="6.5" ry="5" fill="#141414"/>
    <path d="M93 106 q7 6 14 0" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round"/>
    <path d="M108 108 L127 118" stroke="#141414" stroke-width="2.5"/>
    <g transform="rotate(9 145 124)">
      <rect x="124" y="112" width="42" height="23" rx="5" fill="#fff" stroke="#141414" stroke-width="3"/>
      <text x="145" y="128.5" text-anchor="middle" font-family="'Black Han Sans','Malgun Gothic',sans-serif" font-size="11" fill="#f5468e">shu.is</text>
    </g>
  </svg>
  <div id="go"><div class="spin"></div><h1>슈슈가 데려다주고 있어요… 슝~ 🐾</h1><p id="slugShow"></p></div>
  <div id="nf"><h1>슈슈가 킁킁… 없는 주소예요 🤔</h1><p id="nfSlug"></p><p style="margin-top:14px"><a href="javascript:history.back()">← 뒤로 가기</a></p></div>
  <div class="brand"><b>SHU</b> · shu.is</div>
</div>
<style>
.shushu .tail{animation:wag .9s ease-in-out infinite;transform-origin:143px 146px}
@keyframes wag{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(16deg)}}
</style>
<script>
const DB = "https://dobble-game-by-sujin-default-rtdb.asia-southeast1.firebasedatabase.app/shu/links";
(async function(){
  let path = location.pathname.replace(/^\//,"").replace(/\/+$/,"");
  // github.io 프로젝트 페이지에서는 첫 세그먼트가 저장소 이름
  if(location.hostname.endsWith("github.io")){
    const seg = path.split("/");
    seg.shift();
    path = seg.join("/");
  }
  let slug;
  try{ slug = decodeURIComponent(path); }catch{ slug = path; }
  if(!slug){ location.replace(location.hostname.endsWith("github.io") ? "/shu/" : "/"); return; }
  document.getElementById("slugShow").textContent = slug;
  try{
    const r = await fetch(`${DB}/${encodeURIComponent(slug)}.json`);
    const data = await r.json();
    if(data && data.url){
      fetch(`${DB}/${encodeURIComponent(slug)}/clicks.json`,{method:"PUT",body:JSON.stringify({".sv":{"increment":1}}),keepalive:true}).catch(()=>{});
      location.replace(data.url);
      return;
    }
  }catch(e){}
  document.getElementById("go").style.display="none";
  document.getElementById("nfSlug").textContent = '"'+slug+'"';
  document.getElementById("nf").style.display="block";
})();
</script>
</body>
</html>
